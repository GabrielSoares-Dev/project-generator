name: agent-team

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch:
    uses: OWNER/agent-team/.github/workflows/dispatcher.yml@v0.1.0
    with:
      agents-repository: OWNER/agent-team
      agents-ref: v0.1.0
